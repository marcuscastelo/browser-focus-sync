name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q runtime manage.py tests
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: runtime
          BROWSER_FOCUS_SYNC_CONFIG: /tmp/browser-focus-sync-ci-no-config.toml
  linux-idle-helper:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git cmake extra-cmake-modules qt6-base kidletime
      - uses: actions/checkout@v4
      - run: cmake -S native -B build && cmake --build build
